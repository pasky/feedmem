[project]
name = "feedmem"
version = "0.1.0"
description = "Long-term memory for your social feeds - archive, search, and recall tweets, likes, bookmarks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "urwid>=2.2.0",
]

[project.optional-dependencies]
llm = ["llm>=0.17"]

[project.scripts]
feedmem = "feedmem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "feedmem[llm]",
    "pre-commit>=4.2.0",
    "pyright>=1.1.407",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]
