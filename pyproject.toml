[project]
name = "feedmem"
version = "0.1.0"
description = "Long-term memory for your social feeds - archive, search, and recall tweets, likes, bookmarks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
feedmem = "feedmem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
